<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Security Headers ── -->
    <!-- CSP: allows self + fonts + all secure map tile sources + BMKG API -->
    <meta http-equiv="Content-Security-Policy"
      content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:;
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com;
        font-src 'self' https://fonts.gstatic.com data:;
        img-src 'self' data: blob: https:;
        connect-src 'self' https: wss: ws:;
        worker-src 'self' blob:;
        frame-ancestors 'none';
      "
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()" />

    <!-- ── Viewport & Rendering ── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#020617" />

    <!-- ── SEO ── -->
    <title>RAWAN — Ruang Antisipasi Waspada Anak Nusantara</title>
    <meta name="description" content="RAWAN adalah platform edukasi bencana alam 3D interaktif untuk siswa dan anak Indonesia. Pelajari mitigasi gempa bumi, tsunami, gunung api, banjir, tanah longsor, dan puting beliung." />
    <meta name="keywords" content="edukasi bencana, mitigasi bencana, gempa bumi, tsunami, gunung api, banjir, tanah longsor, BNPB, BMKG, simulasi 3D, Indonesia" />
    <meta name="author" content="RAWAN — Edukasi Mitigasi Kebencanaan" />
    <meta name="robots" content="index, follow" />

    <!-- ── Open Graph (WhatsApp / FB share preview) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RAWAN — Edukasi Bencana 3D Interaktif" />
    <meta property="og:description" content="Simulasi bencana alam 3D, peta risiko real-time, dan kuis mitigasi untuk pelajar Indonesia." />
    <meta property="og:image" content="/logo_rawan.png" />
    <meta property="og:locale" content="id_ID" />

    <!-- ── PWA / Mobile App ── -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RAWAN" />

    <!-- ── Favicon ── -->
    <link rel="icon" type="image/png" href="/logo_rawan.png" />
    <link rel="apple-touch-icon" href="/logo_rawan.png" />

    <!-- ── Performance: Preconnect to external origins ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://tile.openstreetmap.org" />

    <!-- ── Google Fonts: Inter — preloaded for zero FOUT ── -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- ── Leaflet CSS (integrity hash pinned for security) ── -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="anonymous"
    />

    <!-- ── Inline critical styles: prevent flash of unstyled content ── -->
    <style>
      html, body { margin: 0; padding: 0; background: #020617; }
      #root { min-height: 100dvh; }
    </style>
  </head>

  <body class="bg-[#020617] text-slate-100 antialiased selection:bg-emerald-500 selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
